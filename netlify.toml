# Configuration Netlify (alternative à GitHub Pages — voir DEPLOIEMENT.md)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # SITE_URL est à définir dans l'interface Netlify (Site configuration → Environment variables)
  BASE_PATH = "/"

# En-têtes de sécurité et de cache raisonnables pour un site statique
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
